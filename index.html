<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Frontend Mentor | Typing Speed Test</title>
</head>
<body>
  <main class="app" data-state="idle">
    <h1 class="visually-hidden">Typing Speed Test</h1>

    <header class="header">
      <a class="brand" href="#" aria-label="Typing Speed Test home">
        <img class="brand__logo brand__logo--large" src="./assets/images/logo-large.svg" alt="">
        <img class="brand__logo brand__logo--small" src="./assets/images/logo-small.svg" alt="">
      </a>

      <div class="personal-best" aria-live="polite">
        <img src="./assets/images/icon-personal-best.svg" alt="">
        <span class="personal-best__label">Personal best:</span>
        <span class="personal-best__mobile">Best:</span>
        <strong id="personalBest">-- WPM</strong>
      </div>
    </header>

    <section class="toolbar" aria-label="Test controls and statistics">
      <dl class="stats">
        <div class="stat">
          <dt>WPM:</dt>
          <dd class="stat__value" id="wpmValue">0</dd>
        </div>
        <div class="stat">
          <dt>Accuracy:</dt>
          <dd class="stat__value" id="accuracyValue">100%</dd>
        </div>
        <div class="stat">
          <dt>Time:</dt>
          <dd class="stat__value" id="timeValue">0:60</dd>
        </div>
      </dl>

      <div class="controls">
        <div class="control control--language" data-control="language">
          <label class="control__label" for="languageSelect">Language:</label>
          <select class="control__select" id="languageSelect" name="language">
            <option value="en">English</option>
            <option value="uk">Українська</option>
          </select>
        </div>

        <div class="control control--difficulty" data-control="difficulty">
          <label class="control__label" for="difficultySelect">Difficulty:</label>
          <select class="control__select" id="difficultySelect" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div class="control control--mode" data-control="mode">
          <label class="control__label" for="modeSelect">Mode:</label>
          <select class="control__select" id="modeSelect" name="mode">
            <option value="timed">Timed (60s)</option>
            <option value="passage">Passage</option>
          </select>
        </div>
      </div>
    </section>

    <section class="typing-card" aria-label="Typing area">
      <button class="passage" id="passage" type="button" aria-label="Typing passage. Click and begin typing."></button>

      <div class="start-overlay" id="startOverlay">
        <button class="primary-button" id="startButton" type="button">Start Typing Test</button>
        <p>Or click the text and start typing</p>
      </div>

      <textarea class="typing-input" id="typingInput" aria-label="Type the passage here" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    </section>

    <div class="action-row">
      <button class="restart-button" id="restartButton" type="button">
        <span>Restart Test</span>
        <img src="./assets/images/icon-restart.svg" alt="">
      </button>
    </div>

    <section class="results" id="results" aria-live="polite" hidden>
      <img class="results__icon results__icon--complete" src="./assets/images/icon-completed.svg" alt="">
      <img class="results__icon results__icon--new" src="./assets/images/icon-new-pb.svg" alt="">
      <img class="results__confetti" src="./assets/images/pattern-confetti.svg" alt="">
      <img class="decor decor--one" src="./assets/images/pattern-star-1.svg" alt="">
      <img class="decor decor--two" src="./assets/images/pattern-star-2.svg" alt="">

      <h2 id="resultTitle">Test Complete!</h2>
      <p id="resultMessage">Solid run. Keep pushing to beat your high score.</p>

      <dl class="result-grid">
        <div class="result-card">
          <dt>WPM:</dt>
          <dd id="resultWpm">0</dd>
        </div>
        <div class="result-card">
          <dt>Accuracy:</dt>
          <dd id="resultAccuracy">100%</dd>
        </div>
        <div class="result-card">
          <dt>Characters</dt>
          <dd><span class="result-count result-count--correct" id="resultCorrect">0</span><span>/</span><span class="result-count result-count--incorrect" id="resultIncorrect">0</span></dd>
        </div>
      </dl>

      <button class="again-button" id="againButton" type="button">
        <span>Go Again</span>
        <img src="./assets/images/icon-restart.svg" alt="">
      </button>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
